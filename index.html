const screens=[
['home','01','今日与场景入口','首页按三大功能框组织：日常脑状态监测、监测＋光照、休息光照。','首页第一功能框为日常脑状态监测；第二大框为监测＋光照，内含疲劳状态观察、专注状态引导、冥想状态引导三个同级入口；第三大框为休息光照。点击专注状态引导或冥想状态引导直接进入对应体验确认，不再经过状态引导目标选择；较佳表现移至个人趋势下的后续个人分析规划，不启用已延期的认知任务。首页问候语“现在是否感到清醒？”沿用用户此前提出的文案建议，清醒/有些困/说不准为交互提案；可选作答，无量表依据，不用于筛选光照方案。回应仅为当前页面的主观感受，不作为EEG判断或量表评分。Get to know介绍日常常见状态，不表示用户个人状态频次排行；睡眠仍在测量准备页每日记录。'],
['plan','02','方案确认','疲劳场景优先展示完整测量＋光照，可切换仅测量。','日常脑状态监测仅做4分钟EEG，不经过疲劳自评。疲劳状态观察默认测量＋疲劳光照，也可选仅测量；光照12分钟是既有交互预设。首页已确定专注状态引导或冥想目标，直接进入对应确认页；共用状态引导流程，仅在用户主动更换目标时展示目标选择。较佳表现只从个人趋势进入后续分析规划，不启动单次光照；认知任务评估保持延期。所有光照参数与目标映射均待正式确认，不代表算法推荐。'],
['wear','03','佩戴与质量检查','检查佩戴并补充当天睡眠信息，再开始采集。','昨夜睡眠放在测量准备页，按北京时间日期每日记录一次，可修改或跳过。前测/日常测量可见，后测隐藏；直接开始视为本日略过，不填默认值。原型仅当前浏览器保存，正式后台按用户ID和记录日关联当日会话。每个Fp1/Fpz/Fp2通道同时显示接触状态与滚动波形，可暂停。波形为前端模拟，质量不足演示更大伪迹波动，不用平滑或振幅直接判定质量。真实产品须接收带时间戳的设备数据、显示缺失，不以模拟波形填补断连；不展示未冻结的阻抗阈值。质量不足禁止开始，给出重新佩戴操作。'],
['measure','04','四段采集','睁眼 60 秒 → 闭眼 60 秒 → 闭眼 60 秒 → 睁眼 60 秒。','总计 4 分钟。语音与文字同时提示；过渡窗暂列 3–5 秒，最终长度待定。四段取共同有效分段数 N，不展示虚构门槛。'],
['self','05','主观自评','把自评作为独立来源。','自评与脑电、行为结果分开存储。跳过自评后注明缺失；自评刻度为本 UE 的交互提案，待团队确认。'],
['result','07','分层结果','先读结论，再看依据、质量和下一步。','质量门失败不输出估计；证据冲突显示尚不能确定；无基线只展示本次记录。候选 EEG 指标不作为已验证状态评分。'],
['features','08','脑波与质量详情','δ、θ、α、β在同一时间轴叠加呈现，可切换眼状态与频段显隐。','Butterfly采用四频段滤波信号、共同时间轴和零基线，图例可切换显隐。当前合成波形各自归一化，不用相对功率百分比冒充时域信号。正式版本需按同通道同有效窗生成，数据不足不绘图；保留协议、设备、算法与指标版本；无头皮地形图，不输出 γ 波。MMN 未验证，响应权重为 0。'],
['light','09','光照与状态引导','按场景显示光照或文字引导；休息光照支持5/8/10/20分钟。','既有交互时长占位：专注8／冥想10／疲劳12分钟，正式方案待硬件及算法确认。状态引导采用三段文字练习，前后各测4分钟；不根据EEG实时调光、不输出状态达成判断。停止与设备异常沿用共用流程。'],
['complete','10','前后记录','呈现变化，同时保留归因边界。','前后变化仅是观察，不等于光照有效。休息光照无 EEG 响应、无前后差、无剂量曲线。'],
['trends','11','个人趋势','回看脑电记录，并了解后续个人分析。','本版展示三条明确标为合成示例的脑电记录，不当作真实历史或趋势；较佳表现位于此处的后续分析规划。不得显示延期任务的虚构成绩。'],
['guide-select','20','更换引导目标 · 次级页面','仅从体验确认页的更换目标进入，不是首页必经步骤。','首页将疲劳状态观察、专注状态引导、冥想状态引导并列，统一按钮样式且不带箭头；组内说明默认包含EEG前后测与光照。专注和冥想共用状态引导流程，目标名称不表示已识别或确保进入该状态；较佳表现仍在个人趋势中作为后续分析规划。'],

let visibleBands=[true,true,true,true];
const butterflyColors=['#83b8e2','#8d9df1','#c2a0f2','#efb7d7'];
function butterflyPlot(){
 const phase=eegRecord*.55+(eyeView==='ec'?.85:0);
 const frequencies=[2.2,6,10,16];
 const curves=frequencies.map((f,i)=>{
  const raw=Array.from({length:601},(_,j)=>{let t=j/300;return (1+.16*Math.sin(2*Math.PI*.6*t+i))*Math.sin(2*Math.PI*f*t+phase+i*.4)+.14*Math.sin(2*Math.PI*(f+.7)*t+phase)});
  const max=Math.max(...raw.map(Math.abs));
  const d=raw.map((v,j)=>(j?'L':'M')+(32+j*.44).toFixed(2)+' '+(86-v/max*48).toFixed(2)).join(' ');
  return visibleBands[i]?`<path class="butterfly-trace" data-band-path="${i}" stroke="${butterflyColors[i]}" d="${d}"/>`:'';
 }).join('');
 return `<svg class="butterfly-plot" viewBox="0 0 310 180" role="img" aria-label="${eyeView==='eo'?'睁眼':'闭眼'}四频段叠加波形，当前显示${bandMeta.filter((_,i)=>visibleBands[i]).map(x=>x[0]).join('、')}，合成示意"><text x="32" y="13" class="axis-note">归一化振幅</text><g class="butterfly-grid"><path d="M32 38H296M32 62H296M32 110H296M32 134H296M98 30V142M164 30V142M230 30V142"/></g><path class="butterfly-zero" d="M32 86H296"/><g class="axis-note"><text x="6" y="41">+1</text><text x="14" y="89">0</text><text x="8" y="137">−1</text><text x="30" y="160">0</text><text x="88" y="160">0.5</text><text x="154" y="160">1.0</text><text x="220" y="160">1.5</text><text x="279" y="160">2.0</text><text x="239" y="176">时间（秒）</text></g>${curves}</svg>`;
}

function eegSummary(compact=false){
 const r=eegRecords[eegRecord],powers=r[eyeView],total=powers.reduce((a,b)=>a+b,0);
 if(quality==='bad')return `<div class="card"><h3>脑波数据不足</h3><p>本次质量不足，暂不展示波形或频段分布。</p></div>`;

}

let sleepEditing=false;
const sleepMemory={};
const sleepOptions={short:'少于 6 小时',usual:'6–8 小时',long:'超过 8 小时'};
function sleepDay(now=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);}
function readSleep(){const day=sleepDay();try{const value=JSON.parse(localStorage.getItem('brainlume:sleep:'+day)||'null');if(value&&value.record_date===day&&(['answered','skipped'].includes(value.status))&&(!value.range||sleepOptions[value.range]))return value;}catch(e){}return sleepMemory[day]||null;}
function saveSleep(range){const old=readSleep();if(range==='skip'&&old&&old.status==='answered'){sleepEditing=false;return;}const row={record_date:sleepDay(),sleep_period:'previous_night',status:range==='skip'?'skipped':'answered',range:range==='skip'?null:range,updated_at:new Date().toISOString()};sleepMemory[row.record_date]=row;try{localStorage.setItem('brainlume:sleep:'+row.record_date,JSON.stringify(row));}catch(e){}sleepEditing=false;}
function sleepCard(){const row=readSleep();if(row&&!sleepEditing)return `<div class="card sleep-saved"><div><span class="tiny">昨夜睡眠</span><br><strong>${row.status==='answered'?sleepOptions[row.range]:'未填写'}</strong></div><button data-sleep="edit">${row.status==='answered'?'修改':'补充'}</button></div>`;return `<div class="card"><h3>昨晚睡了多久？</h3><p class="tiny">每天记一次，帮助回看今天的状态。</p><div class="sleep-options">${Object.entries(sleepOptions).map(([k,v])=>`<button data-sleep="${k}" aria-pressed="${row?.range===k}">${v}</button>`).join('')}</div><button class="sleep-skip" data-sleep="skip">${row?.status==='answered'?'取消修改':'今天先不填'}</button></div>`;}


let wavePaused=false;
function signalWave(channel){
 const poor=quality==='bad';
 const points=Array.from({length:601},(_,x)=>{const t=(x%300)/300,phase=channel*.9;let value=(6+2*Math.sin(2*Math.PI*3*t+phase))*Math.sin(2*Math.PI*(17+channel)*t+phase)+3*Math.sin(2*Math.PI*7*t+phase);if(poor)value=value*1.8+12*Math.sin(2*Math.PI*2*t+phase)+8*Math.sin(2*Math.PI*39*t+phase);return (x?'L':'M')+x+' '+(32+value).toFixed(2)}).join(' ');
 return `<svg class="signal-wave ${wavePaused?'wave-paused':''}" viewBox="0 0 300 64" role="img" aria-label="${['Fp1','Fpz','Fp2'][channel]}动态波形示意，${poor?'接触需调整':'接触稳定'}"><path class="wave-grid" d="M0 16H300M0 32H300M0 48H300M50 0V64M100 0V64M150 0V64M200 0V64M250 0V64"/><g class="wave-strip"><path class="wave-trace ${poor?'wave-poor':''}" d="${points}"/></g></svg>`;
}

let restRunning=false,restStartedAt=0,restActualSeconds=0,restEndedEarly=false;
function restElapsed(){return Math.min(rest*60,Math.max(0,Math.floor((Date.now()-restStartedAt)/1000)));}
function restTime(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function finishRest(early=true){if(restRunning)restActualSeconds=restElapsed();restEndedEarly=early&&restActualSeconds<rest*60;restRunning=false;}

function guideSelection(){return `<span class="tag">状态引导</span><h2>这次想如何开始？</h2><p>选择一个目标，跟随一段引导。</p><button class="guide-choice" data-guide-goal="focus"><strong>专注状态引导</strong><span>为接下来的学习、工作或创作做准备</span></button><button class="guide-choice" data-guide-goal="meditation"><strong>冥想状态引导</strong><span>将注意带回呼吸，留意当下</span></button><p class="tiny">这里选择的是体验目标，不是对你当前脑状态的判断。</p>`;}
function guidePlan(){const g=guideConfig[guideGoal];return `<span class="tag">${g.name}</span><h2>${g.title}</h2><p>${g.description}</p><div class="card check-summary"><div class="value">${8+g.minutes} <span>分钟 · 演示流程</span></div><p>前测 4 分钟 → 引导 ${g.minutes} 分钟 → 后测 4 分钟</p><p class="tiny">包含文字引导与光照方案演示。光照参数与时长尚待确认，原型不连接设备。</p></div><p>准备好设备后，先记录本次脑电，再开始引导。</p>${btn('检查佩戴，开始前测','guide-start','primary')}${btn('更换目标','guide-select')}<details class="check-details"><summary>你会获得什么？</summary>${guideGoal==='focus'?'<p>心流是这一方向希望探索的目标体验；当前原型不判断是否已进入心流。</p>':''}<p>本次体验记录、Butterfly、脑电特征与数据质量。不输出心流分数、冥想等级或状态达成判断。</p><p>引导中不插入测量或疲劳问卷，结束后再进行同协议后测。可随时停止；首次仅提供固定方案，不根据EEG实时调光。</p><p>正式光照方案需由硬件与算法团队批准；8／10分钟为既有交互占位，不能作为剂量推荐。</p></details>`;}
function guideSession(){const g=guideConfig[guideGoal],stepText=g.steps[guideStep];return `<span class="tag">${g.name}</span><h2>${stepText[0]}</h2><div class="orb">◌</div><p class="guide-instruction" aria-live="polite">${stepText[1]}</p><div class="steps">${g.steps.map((v,i)=>`<span class="${guideStep===i?'on':''}">${i+1}</span>`).join('')}</div><p class="tiny">文字引导 ${guideStep+1} / ${g.steps.length} · 自主阅读，无音频播放</p>${card('本次光照方案',`${g.minutes} 分钟 · 交互预设占位<p class="tiny">按钮演示进程，不执行真实光照或EEG实时调节。</p>`)}${card('设备守护','温度、累计能量、限流与佩戴监测正常（模拟）')}${guideStep<g.steps.length-1?'<button class="primary" data-guide-next>下一段引导</button>':'<button class="primary" data-action="lightend">结束引导，开始后测</button>'}${btn('断连／摘下','invalid-light')}${btn('立即停止／感到不适','safety')}`;}
function guideComplete(){const g=guideConfig[guideGoal],labels=guideGoal==='focus'?['准备好了','还想缓一缓']:['容易跟随','有些分心'];return `<span class="tag">${g.name}</span><h2>${guideGoal==='focus'?'本次准备已完成':'本次练习已结束'}</h2>${card('本次记录',`${g.name} · 完整流程示例<p class="tiny">文字引导、光照方案与前后测记录均为原型演示，不表示已经进入目标状态。</p>`)}<div class="card"><h3>${guideGoal==='focus'?'现在准备好开始任务了吗？':'这次跟随练习的感觉如何？'}</h3><div class="feeling-options" role="group" aria-label="本次体验反馈">${labels.map((label,i)=>`<button data-guide-feedback="${i}" class="${guideFeedback===String(i)?'feeling-selected':''}" aria-pressed="${guideFeedback===String(i)}">${label}</button>`).join('')}</div><button class="sleep-skip" data-guide-feedback="skip">跳过反馈</button><p class="tiny" aria-live="polite">${guideFeedback==='skip'?'本次未记录体验反馈。':guideFeedback!==''?'已记录你的体验，不作为脑电或功效结论。':'可选反馈，仅记录本次主观体验。'}</p></div>${eegAssessment('后测')}<p class="tiny">前测和后测需分别保存；当前仅示意后测记录。脑电变化不直接判定心流、冥想或任务表现改善。</p>${btn(guideGoal==='focus'?'结束准备，去做任务':'结束本次，返回今日','home','primary')}${btn('查看个人趋势','trends')}`;}

function body(id){let s=scenes[scene];switch(id){case 'guide-select':return guideSelection();case 'guide-plan':return guidePlan();case 'home':return `<div class="orb greeting-orb">◌</div><span class="tiny">你好，欢迎回来</span><h2>现在是否感到清醒？</h2><div class="feeling-options" role="group" aria-label="此刻清醒感">${[['clear','清醒'],['sleepy','有些困'],['unsure','说不准']].map(([k,t])=>`<button data-feeling="${k}" class="${alertnessFeeling===k?'feeling-selected':''}" aria-pressed="${alertnessFeeling===k}">${t}</button>`).join('')}</div><p class="tiny" aria-live="polite">${alertnessFeeling==='clear'?'按自己的节奏，选择接下来的体验。':alertnessFeeling==='sleepy'?'可以了解一下疲劳状态观察，也可以先休息。':alertnessFeeling==='unsure'?'可以先测量，看看这一次的记录。':'从此刻的感受开始，也可以直接选择下方场景。'}</p><div class="row"><span class="tag">设备已连接</span><span class="tiny">电量 86% · 演示</span></div><div class="home-functions" aria-label="主要功能"><button class="function-frame function-single" data-go="daily"><span class="function-index">01</span><strong>日常脑状态监测</strong></button><section class="function-frame function-combined" aria-label="监测加光照"><div class="function-heading"><span class="function-index">02</span><h3>监测＋光照</h3></div><p class="function-description">默认包含 EEG 前测、光照与 EEG 后测</p><div class="function-choices"><button data-scene="fatigue">疲劳状态观察 </button><button data-guide-goal="focus">专注状态引导</button><button data-guide-goal="meditation">冥想状态引导</button></div></section><button class="function-frame function-single" data-go="rest"><span class="function-index">03</span><strong>休息光照</strong></button></div><button class="learn-entry" data-go="learn"><span class="eyebrow">GET TO KNOW</span><strong>最常出现的大脑状态 <span aria-hidden="true">↗</span></strong><span class="tiny">认识日常的清醒、疲劳、放松与专注</span></button>`;
case 'plan':{if(entryKind==='guidance')return guidePlan();if(entryKind==='daily')return `<span class="tag">日常脑状态监测</span><h2>记录今天的脑电状态</h2>${card('4 分钟 EEG','按提示完成睁眼、闭眼采集。结果包含脑波、质量与可用的个人参考。')}${btn('检查佩戴，开始测量','startplan','primary')}<p class="tiny">此模式只做测量，不包含光照或疲劳自评。</p>`;
const cognitive=scene==='cognitive';const goal=cognitive?'focus':scene==='fatigue'?'fatigue':'relax';const lightMinutes={focus:8,fatigue:12,relax:10}[goal];const goalName={focus:'专注',fatigue:'疲劳',relax:'放松'}[goal];
return `<span class="tag">${s[0]}</span><h2>${cognitive?(fromBest?'较佳表现 · 任务评估':'认知表现评估'):scene==='fatigue'?'了解此刻的疲劳感':'观察此刻的脑电特征'}</h2><div class="cog-modes" role="group" aria-label="使用模式">${(()=>{const only=`<button data-cogmode="only" class="${!includeLight?'selected':''}" aria-pressed="${!includeLight}">${cognitive?'仅评估':'仅测量'}</button>`;const full=`<button data-cogmode="light" class="${includeLight?'selected':''}" aria-pressed="${includeLight}">${cognitive?'评估':'测量'}＋${goalName}光照</button>`;return scene==='fatigue'?full+only:only+full})()}</div><div class="card check-summary"><div class="value">${includeLight?8+lightMinutes:4} <span>分钟${cognitive?'＋任务':''}</span></div><p>${includeLight?(cognitive?'EEG＋任务前测 → 专注光照 → EEG＋任务后测':'前测 4 分钟 → '+goalName+'光照 '+lightMinutes+' 分钟 → 后测 4 分钟'):(cognitive?'EEG 4 分钟 → 反应任务 → 结果':'跟随提示睁眼、闭眼，结束后记录感受。')}</p><p class="tiny">${cognitive?'任务用时另计。':'自评用时另计。'}${includeLight?'光照强度由个人标定决定。':''}</p></div><button class="primary" data-go="startplan">${includeLight?'开始前测':cognitive?'开始评估':'开始检查'}</button><details class="check-details"><summary>使用说明</summary><p>模式是本 UE 的场景预设，光照时长沿用方案文档；不表示已验证改善效果。</p><p>每次 EEG 为四段睁闭眼采集，各 60 秒。状态引导不经过疲劳自评；认知任务评估留待下一版，较佳表现从个人趋势查看后续分析规划。</p><p>光照前需完成个人标定，强度不由用户调节。设备佩戴、质量检查和安全监测沿用共通流程。</p><p>前后变化仅供观察；无个人参考时仅展示本次。不用于疾病诊断或驾驶适格判断。</p></details>`;
}
case 'wear':return `<h2>让信号更稳定</h2><p>坐稳并放松额头，调整设备贴合。</p><div class="row"><span class="tiny">三通道波形 · 模拟信号</span><button class="wave-toggle" data-wave-toggle aria-pressed="${wavePaused}">${wavePaused?'播放波形':'暂停波形'}</button></div>${['Fp1','Fpz','Fp2'].map((x,i)=>`<div class="card signal-card"><div class="row"><strong>${x}</strong><span class="tag">${quality==='bad'?'需调整':'接触稳定'}</span></div>${signalWave(i)}</div>`).join('')}<p class="tiny">波形仅作交互示意，非实时设备数据。接触状态需由设备质量检测确认。</p><div class="warn">${quality==='bad'?'当前质量不足。重新佩戴后再次检查。':'请尽量减少眨眼、咬紧和头部运动。'}</div>${!after?sleepCard():''}${quality==='bad'?'<button data-action="fix">已调整，重新检查</button>':btn('开始四段采集','measure','primary')}${btn('结束本次','home')}`;

case 'self':if(scene==='cognitive')return body('task');return `<h2>记录此刻的感受</h2><p>你的感受与采集特征会分开呈现。</p><label>疲劳感 <output id="rating">${rating} / 5</output><input id="ratingInput" type="range" min="1" max="5" value="${rating}"></label><div class="row tiny"><span>几乎不疲劳</span><span>非常疲劳</span></div>${scene==='cognitive'?btn('继续反应任务','task','primary'):btn('保存自评，查看结果','result','primary')}${btn('跳过自评','skipself')}`;

if(quality==='bad')return `<h2>本次脑波数据不足</h2><p>信号质量未通过，暂不输出频段分布或计算指标。</p>${btn('检查佩戴，重新测量','wear','primary')}${btn('返回结果','result')}`;

}

if(mode==='changes')$('#app').innerHTML=`<h2>给 UI 设计师的更新清单</h2><div class="notice"><strong>2026.11.22 · 场景命名与按钮样式统一</strong><br>首页「监测＋光照」包含疲劳状态观察、专注状态引导、冥想状态引导三个同级入口，统一为目标状态与产品动作的表述，按钮全部去掉箭头；共用说明明确包含EEG前后测与光照，心流移至专注方向的说明；专注与冥想直接进入对应方案确认，省去目标选择层，继续共用文字引导与前后EEG流程。较佳表现从个人趋势进入后续个人分析规划，删除重复的任务前准备流程和虚构任务历史。休息光照默认10分钟，可选5／8／10／20分钟；默认值是产品交互设置，不表示经过验证的个体剂量推荐。光照时长仅为既有交互预设，正式参数待确认。</div><div class="notice"><strong>当前版停用：认知表现／任务表现评估。</strong> 延期至下一版，待确定任务类型、评分模型及验证方案；任务入口保持停用。较佳表现移至个人趋势的后续分析规划；首页的专注状态引导、冥想状态引导分别承接单次体验。<br><strong>休息建议改为场景内条件提示。</strong> 首页无独立入口；状态需留意（演示）或用户自报较累时出现。质量不足优先重测，真实算法触发规则待验证。</div><p class="intro">参照 V6 看板的蓝紫色、AI 入口与模块结构，重构使用场景和结果解释。此文件为独立交付，不覆盖原 GitHub 页面。</p><table><tr><th>V6 模块</th><th>本稿更新</th><th>对应页面</th></tr>${[['首页 / AI 对话','三大功能框承接日常监测、监测＋光照与休息光照；疲劳状态观察、专注状态引导、冥想状态引导在第二大框中同级，较佳表现归入个人趋势','01–02'],['指导 / 测量 / 自评','质量前置；EO–EC–EC–EO 各 60 秒；任务评估延期，保留下一版需求备注','03–06'],['单次结果 / 专业报告','结论、行为、自评、候选特征分层；低质量/冲突/无参考降级','07–08'],['光照 / 完成','闭环与只照不测分流；固定时长；移除疗效归因','09–10'],['趋势 / 标定','按可比性筛选、断点不插值；标定 6→最多10 次','11–14'],['无法比较 / 设备 / 数据用途','整次重测、待决异常、安全停止、独立研究同意','15–18']].map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}</table><h2>路径与验收</h2><div class="flow">日常：01 → 02 → 03 → 04 → 07（不经过疲劳自评）<br>专注状态引导或冥想：01首页直达 → 21对应体验确认 → 03佩戴 → 04前测 → 07记录 → 09引导 → 04后测 → 10本次记录<br>较佳表现：11个人趋势 → 12后续个人分析规划<br>认知任务评估：延期至下一版，当前不开放<br>闭环：前测 04 → 05 → 07 → 09 → 后测 04 → 05 → 10<br>休息：01 → 只照不测 5/8/10/20 分钟（默认10），可中途结束→ 09 → 10</div><details open><summary>UI 需要绘制的补充状态</summary><p>佩戴不足 / 质量不足 / 特征冲突 / 无个人参考 / 任务未完成 / 中断不可比 / 版本不一致 / 光照停止 / 标定未完成 / 研究不同意 / 导出与删除确认。登录、邮箱、找回密码等继续参考 V6，此稿没有替换其全部 67 个状态。</p></details><details open><summary>仍需产品、算法与硬件确认</summary><p>Q1 / Q2：光照中途断连、摘下的最终处理；Q3：采集时长与信度；Q4：训练标签能否完全来自自评。另需冻结质量门、过渡窗、频段定义、主响应指标与符号、任务规格、样本门槛、提示频率上限和安静时段、隐私保存期限。</p></details><details><summary>设计语言与版式</summary><p>移动端内容宽约 350–390px；深海蓝面板、冷白正文、浅紫数据和主行动。正文建议 14–16px、辅助 12px 以上；本看板缩放展示，实际 UI 须按设备校验。停止按钮保留明确文字；状态同时用文字和颜色表达。图表需显示指标、单位、时间范围、参考来源、缺失原因。</p></detai let after=false;function bind(){document.querySelectorAll('[data-guide-goal]').forEach(b=>b.onclick=()=>{setEntry('guidance');guideGoal=b.dataset.guideGoal;lightGoal=guideGoal==='focus'?'focus':'relax';openScreen('guide-plan');window.scrollTo(0,0)});document.querySelectorAll('[data-guide-next]').forEach(b=>b.onclick=()=>{guideStep=Math.min(guideStep+1,2);render()});document.querySelectorAll('[data-guide-feedback]').forEach(b=>b.onclick=()=>{guideFeedback=b.dataset.guideFeedback;render()});document.querySelectorAll('[data-record-open]').forEach(b=>b.onclick=()=>{setEntry('daily');eegRecord=Number(b.dataset.recordOpen);quality='good';openScreen('result');window.scrollTo(0,0)});if($('#attentionState'))$('#attentionState').onchange=e=>{stateNeedsAttention=e.target.value==='attention';render()};document.querySelectorAll('[data-gallery]').forEach(b=>b.onclick=()=>{galleryKind=b.dataset.gallery;mode='flows';render();window.scrollTo(0,0)});document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.story.split(':');const [screen,title,variant]=storyboards[k][Number(i)];storyContext(k,variant,screen);mode='prototype';render();window.scrollTo(0,0)});document.querySelectorAll('[data-wave-toggle]').forEach(b=>b.onclick=()=>{wavePaused=!wavePaused;render()});document.querySelectorAll('[data-feeling]').forEach(b=>b.onclick=()=>{alertnessFeeling=b.dataset.feeling;render()});document.querySelectorAll('[data-sleep]').forEach(b=>b.onclick=()=>{if(b.dataset.sleep==='edit')sleepEditing=true;else saveSleep(b.dataset.sleep);render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();window.scrollTo(0,0)});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{openScreen(b.dataset.go);window.scrollTo(0,0)});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{setEntry(b.dataset.scene);openScreen(scene==='best'?'best':scene==='guidance'?'guide-select':scene==='feedback'?'feedback':'plan')});document.querySelectorAll('[data-cogmode]').forEach(b=>b.onclick=()=>{includeLight=b.dataset.cogmode==='light';lightGoal=['cognitive','best'].includes(scene)?'focus':scene==='fatigue'?'fatigue':'relax';render()});if($('#includeLight'))$('#includeLight').onchange=e=>{includeLight=e.target.checked;render()};if($('#lightGoal'))$('#lightGoal').onchange=e=>{lightGoal=e.target.value;render()};document.querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{toggleBand(Number(b.dataset.band));render()});document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{eyeView=b.dataset.eye;render()});if($('#eegRecord'))$('#eegRecord').onchange=e=>{eegRecord=Number(e.target.value);render()};if($('#bestGoal'))$('#bestGoal').onchange=e=>{bestGoal=e.target.value;render()};if($('#rest')){$('#rest').value=rest;$('#rest').onchange=e=>{const minutes=Number(e.target.value);if([5,8,10,20].includes(minutes))rest=minutes;render()}}if($('#path'))$('#path').onchange=e=>{path=e.target.value;render()};if($('#quality'))$('#quality').onchange=e=>{quality=e.target.value;render()};if($('#compare'))$('#compare').onchange=e=>{compare=e.target.value;render()};if($('#ratingInput'))$('#ratingInput').oninput=e=>{rating=Number(e.target.value);$('#rating').textContent=rating+' / 5'};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='rest-start'){restStartedAt=Date.now();restActualSeconds=0;restEndedEarly=false;restRunning=true;render()}if(a==='rest-end'){finishRest(true);openScreen('complete')}if(a==='fix'){quality='good';render()}if(a==='step'){if(step<3){step++;render()}else{openScreen(scene==='cognitive'?'task':['brain','guidance'].includes(scene)?'result':'self')}}if(a==='task'){task=Math.min(task+1,3);render()}if(a==='lightend'){if(path==='rest')openScreen('complete');else{after=true;openScreen('measure')}}});document.querySelectorAll('[data-break]').forEach(b=>b.onclick=()=>{const a=b.dataset.break;if(a==='start'||a==='again'){breakState='active';breakStarted=Date.now()}if(a==='finish')breakState='done';if(a==='dismiss')breakState='dismissed';if(a==='less')restPreference='less';if(a==='off')restPreference='off';render()});document.querySelectorAll('[data-privacy]').forEach(b=>b.onclick=()=>{let area=b.closest('.phone').querySelector('#privacymsg');area.innerHTML=`${b.dataset.privacy}确认演示：此原型不会操作真实数据。<button data-cancel>取消</button><button data-confirm>确认演示</button>`;area.querySelector('[data-cancel]').onclick=()=>render();area.querySelector('[data-confirm]').onclick=()=>area.textContent='已完成演示；未连接真实账户。'});}
function breakClock(){const left=Math.max(0,180-Math.floor((Date.now()-breakStarted)/1000));return String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}
setInterval(()=>{if(restRunning){if(restElapsed()>=rest*60){finishRest(false);if(current==='light'&&path==='rest')openScreen('complete')}else{const timer=document.querySelector('#restclock');if(timer)timer.textContent=restTime(rest*60-restElapsed())}}if(breakState==='active'){if(Date.now()-breakStarted>=180000){breakState='done';if(current==='feedback')render()}else{const clock=document.querySelector('#breakclock');if(clock)clock.textContent=breakClock()}}},1000);
render();
